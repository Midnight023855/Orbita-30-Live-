function variedNonTraffic(items){const focused=shuffleList(items.filter(c=>MIX_FOCUS_IDS.has(c.id)));const regular=items.filter(c=>!MIX_FOCUS_IDS.has(c.id));const groups=new Map();shuffleList(regular).forEach(c=>{if(!groups.has(c.category))groups.set(c.category,[]);groups.get(c.category).push(c);});const out=[];let previous="";while(out.length<regular.length){let choices=[...groups.entries()].filter(([category,list])=>list.length&&category!==previous);if(!choices.length)choices=[...groups.entries()].filter(([category,list])=>list.length);const total=choices.reduce((n,entry)=>n+entry[1].length,0);let r=orbitaRandomUnit()*total;let chosen=choices[0];for(const entry of choices){r-=entry[1].length;if(r<0){chosen=entry;break;}}const camera=chosen[1].pop();out.push(camera);previous=camera.category;}if(!focused.length)return out;const merged=[];const total=out.length+focused.length;let bi=0,fi=0;for(let position=0;position<total;position++){const target=fi<focused.length?Math.floor((fi+1)*total/(focused.length+1)):-1;if(position===target)merged.push(focused[fi++]);else merged.push(out[bi++]);}return merged;}
function distributeEvenly(a,b){let major=a,minor=b;if(major.length<minor.length){major=b;minor=a;}const gaps=minor.length+1,base=Math.floor(major.length/gaps),extra=major.length%gaps,longGaps=new Set(shuffleList(Array.from({length:gaps},(_,i)=>i)).slice(0,extra));const out=[];let cursor=0;for(let i=0;i<gaps;i++){const take=base+(longGaps.has(i)?1:0);for(let j=0;j<take;j++)out.push(major[cursor++]);if(i<minor.length)out.push(minor[i]);}return out;}
function interleaveTraffic(roads,publicTraffic){return distributeEvenly(shuffleList(roads),shuffleList(publicTraffic));}
