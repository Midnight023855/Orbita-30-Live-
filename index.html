const PLAYLIST=CAMERAS;
const frameHost=document.getElementById("frameHost"),placeLabel=document.getElementById("cameraPlace"),titleLabel=document.getElementById("cameraTitle");
let currentIndex=0,map=null,marker=null,hlsPlayer=null;
const fullscreenBtn=document.getElementById("fullscreenBtn");
const fullscreenEnterIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>';
const fullscreenExitIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>';
function syncFullscreenButton(){const active=Boolean(document.fullscreenElement||document.webkitFullscreenElement);fullscreenBtn.innerHTML=active?fullscreenExitIcon:fullscreenEnterIcon;fullscreenBtn.title=active?"Salir de pantalla completa":"Pantalla completa";fullscreenBtn.setAttribute("aria-label",active?"Salir de pantalla completa":"Activar pantalla completa");}
fullscreenBtn.addEventListener("click",async()=>{try{const active=Boolean(document.fullscreenElement||document.webkitFullscreenElement);if(active){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}else{const target=document.getElementById("stage"),request=target.requestFullscreen||target.webkitRequestFullscreen||target.webkitRequestFullScreen;if(request){try{await request.call(target,{navigationUI:"hide"});}catch(_){await request.call(target);}}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}}}catch(_){}syncFullscreenButton();});
document.addEventListener("fullscreenchange",syncFullscreenButton);document.addEventListener("webkitfullscreenchange",syncFullscreenButton);
function setupMap(){if(!window.L)return;map=L.map("miniMap",{zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,minZoom:0,maxZoom:0,zoomSnap:0}).setView([20,0],0);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{minZoom:0,maxZoom:0,noWrap:true,attribution:'© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);const icon=L.divIcon({className:"camera-marker",html:'<span class="camera-dot"></span>',iconSize:[18,18],iconAnchor:[9,9]});marker=L.marker([PLAYLIST[0].lat,PLAYLIST[0].lng],{icon,interactive:false}).addTo(map);setTimeout(()=>map.invalidateSize(),150);}
function showCamera(index){const cam=PLAYLIST[index];placeLabel.textContent=cam.location;titleLabel.textContent=cam.title;if(marker)marker.setLatLng([cam.lat,cam.lng]);if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null;}frameHost.replaceChildren();if(cam.type==="hls"&&cam.stream){const video=document.createElement("video");video.autoplay=true;video.muted=true;video.playsInline=true;video.controls=false;video.preload="auto";video.setAttribute("aria-label",cam.title+" — en vivo");frameHost.appendChild(video);const play=()=>video.play().catch(()=>{});if(window.Hls&&Hls.isSupported()){hlsPlayer=new Hls({liveSyncDurationCount:1,liveMaxLatencyDurationCount:4});hlsPlayer.loadSource(cam.stream);hlsPlayer.attachMedia(video);hlsPlayer.on(Hls.Events.MANIFEST_PARSED,play);}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=cam.stream;video.addEventListener("loadedmetadata",play,{once:true});play();}return;}const f=document.createElement("iframe");f.src=`https://www.youtube.com/embed/${encodeURIComponent(cam.id)}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&disablekb=1&modestbranding=1`;f.title=cam.title+" — en vivo";f.allow="autoplay; encrypted-media; fullscreen; picture-in-picture";f.referrerPolicy="strict-origin-when-cross-origin";f.tabIndex=-1;frameHost.appendChild(f);}
try{setupMap();}catch(e){}
