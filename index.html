const CAMERAS=BASE_CAMERAS;function shuffleList(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function variedNonTraffic(items){const groups=new Map();shuffleList(items).forEach(c=>{if(!groups.has(c.category))groups.set(c.category,[]);groups.get(c.category).push(c);});const out=[];let previous="";while(out.length<items.length){let choices=[...groups.entries()].filter(([category,list])=>list.length&&category!==previous);if(!choices.length)choices=[...groups.entries()].filter(([category,list])=>list.length);const total=choices.reduce((n,entry)=>n+entry[1].length,0);let r=Math.random()*total;let chosen=choices[0];for(const entry of choices){r-=entry[1].length;if(r<0){chosen=entry;break;}}const camera=chosen[1].pop();out.push(camera);previous=camera.category;}return out;}function makeRandomPlaylist(cameras){const roads=shuffleList(cameras.filter(c=>c.category==="Carreteras y tráfico"));const publicTraffic=shuffleList(cameras.filter(c=>c.category==="Tráfico público"));const traffic=shuffleList([...roads,...publicTraffic]);const other=variedNonTraffic(cameras.filter(c=>c.category!=="Carreteras y tráfico"&&c.category!=="Tráfico público"));const slots=other.length+1;if(!traffic.length)return other;const result=[];let used=0;for(let i=0;i<slots;i++){const end=Math.floor((i+1)*traffic.length/slots);result.push(...traffic.slice(used,end));used=end;if(i<other.length)result.push(other[i]);}return result;}let PLAYLIST=makeRandomPlaylist(CAMERAS);

const fullscreenExitIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>';
function syncFullscreenButton(){const active=Boolean(document.fullscreenElement||document.webkitFullscreenElement);fullscreenBtn.innerHTML=active?fullscreenExitIcon:fullscreenEnterIcon;fullscreenBtn.title=active?"Salir de pantalla completa":"Pantalla completa";fullscreenBtn.setAttribute("aria-label",active?"Salir de pantalla completa":"Activar pantalla completa");}
fullscreenBtn.addEventListener("click",async()=>{try{const active=Boolean(document.fullscreenElement||document.webkitFullscreenElement);if(active){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}else{const target=document.getElementById("stage"),request=target.requestFullscreen||target.webkitRequestFullscreen||target.webkitRequestFullScreen;if(request){try{await request.call(target,{navigationUI:"hide"});}catch(_){await request.call(target);}}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}}}catch(_){}syncFullscreenButton();});
document.addEventListener("fullscreenchange",syncFullscreenButton);document.addEventListener("webkitfullscreenchange",syncFullscreenButton);
function setupMap(){if(!window.L)return;map=L.map("miniMap",{zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,tap:false,inertia:false,minZoom:0,maxZoom:0,zoomSnap:0,zoomDelta:0}).setView([20,0],0,{animate:false});for(const h of ["dragging","touchZoom","scrollWheelZoom","doubleClickZoom","boxZoom","keyboard"]){if(map[h]&&map[h].disable)map[h].disable();}L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{minZoom:0,maxZoom:0,noWrap:true,attribution:'© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);const icon=L.divIcon({className:"camera-marker",html:'<span class="camera-dot"></span>',iconSize:[18,18],iconAnchor:[9,9]});marker=L.marker([PLAYLIST[0].lat,PLAYLIST[0].lng],{icon,interactive:false}).addTo(map);setTimeout(()=>map.invalidateSize(),150);}
function showCamera(index){const cam=PLAYLIST[index];placeLabel.textContent=`#${index+1} ${cam.location}`;titleLabel.textContent=cam.title;if(marker)marker.setLatLng([cam.lat,cam.lng]);if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null;}frameHost.replaceChildren();if(cam.type==="embed"){const frame=document.createElement("iframe");frame.title=cam.title;frame.loading="eager";frame.allow="autoplay; fullscreen";frame.allowFullscreen=true;frame.setAttribute("autoplay","");frame.setAttribute("aria-label",cam.title+" — en vivo");frame.src=cam.stream;frameHost.appendChild(frame);return;}if(cam.type==="snapshot"){const image=document.createElement("img");image.alt=cam.title;image.referrerPolicy="no-referrer";image.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000";const separator=cam.stream.includes("?")?"&":"?";image.src=cam.stream+separator+"orbita="+Date.now();image.setAttribute("aria-label",cam.title+" — última imagen");frameHost.appendChild(image);return;}const video=document.createElement("video");video.autoplay=true;video.muted=true;video.playsInline=true;video.controls=false;video.preload="auto";video.setAttribute("aria-label",cam.title+" — en vivo");frameHost.appendChild(video);const play=()=>video.play().catch(()=>{});if(window.Hls&&Hls.isSupported()){hlsPlayer=new Hls({liveSyncDurationCount:1,liveMaxLatencyDurationCount:4});hlsPlayer.loadSource(cam.stream);hlsPlayer.attachMedia(video);hlsPlayer.on(Hls.Events.MANIFEST_PARSED,play);}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=cam.stream;video.addEventListener("loadedmetadata",play,{once:true});play();}else{const msg=document.createElement("div");msg.textContent="Esta cámara no está disponible en este navegador";msg.style.cssText="position:absolute;inset:0;display:grid;place-items:center;color:white;background:#111;font:16px system-ui";frameHost.appendChild(msg);}}
